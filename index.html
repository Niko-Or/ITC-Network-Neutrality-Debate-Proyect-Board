<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
(function () {
  // PASTE YOUR FIREBASE KEYS HERE
const firebaseConfig = {

  apiKey: "AIzaSyACHdnuUjB_4JHFLdi7RTIb6Y9WooAMb7w",

  authDomain: "board-75fc8.firebaseapp.com",

  projectId: "board-75fc8",

  storageBucket: "board-75fc8.firebasestorage.app",

  messagingSenderId: "1032975552354",

  appId: "1:1032975552354:web:cdc01d0323def185b1e63b",

  measurementId: "G-M3T817PLWW"

};


  var PEOPLE = ["Oriol", "Juli", "Nikolas", "Noa"];
  var COLS = [
    { id: "todo", label: "Not started", action: null, color: "var(--st-todo)" },
    { id: "started", label: "Started", action: "Start writing", color: "var(--st-started)" },
    { id: "written", label: "Written", action: "Mark as written", color: "var(--st-written)" },
    { id: "proofread", label: "Proof read", action: "Mark as proof read", color: "var(--st-proofread)" }
  ];
  var CARDS = [
    { id: "democracy", g: "Free access to information", q: "Is the free internet good for democracy?", w: "Oriol", r: "Juli" },
    { id: "speech", g: "Free access to information", q: "Is the free internet necessary for freedom of speech?", w: "Juli", r: "Nikolas" },
    { id: "education", g: "Free access to information", q: "Does the free internet improve education?", w: "Nikolas", r: "Noa" },
    { id: "competitive", g: "Allows competitivity", q: "Does the free internet make the ICT sector more competitive?", w: "Noa", r: "Oriol" },
    { id: "innovative", g: "Allows competitivity", q: "Does the free internet make the ICT sector more innovative?", w: "Noa", r: "Nikolas" },
    { id: "modify-info", g: "Telecommunications as critical infrastructure", q: "Should ISPs be allowed to modify information in the network? In other words, is the information also in the domain of the networks?", w: "Nikolas", r: "Oriol" },
    { id: "fair-practices", g: "Telecommunications as critical infrastructure", q: "Which fair practices are the most effective and least restrictive?", w: "Oriol", r: "Juli" },
    { id: "stomach-cost", g: "Infrastructure costs must not pass to users", q: "Can content providers stomach the additional cost?", w: "Juli", r: "Nikolas" },
    { id: "cp-growth", g: "Infrastructure costs must not pass to users", q: "Does investment mean growth for content providers?", w: "Nikolas", r: "Noa" },
    { id: "telco-invest", g: "Infrastructure costs must not pass to users", q: "Does additional investment in telecommunications companies mean more infrastructure?", w: "Noa", r: "Oriol" },
    { id: "reg-invest", g: "More regulation does not mean less investment", q: "Does more regulation decrease investment?", w: "Oriol", r: "Nikolas" },
    { id: "reg-innovation", g: "More regulation does not mean less investment", q: "And does it, in turn, decrease innovation in the sector?", w: "Nikolas", r: "Juli" },
    { id: "qos-current", g: "QoS and lower prices", q: "Can quality of service and lower prices be ensured with current growth and the infrastructure charge?", w: "Juli", r: "Noa" },
    { id: "qos-priority", g: "QoS and lower prices", q: "Can they be ensured with priority as a service?", w: "Noa", r: "Oriol" },
    { id: "priority-limit", g: "Priority for critical services", q: "What is the limit?", w: "Oriol", r: "Juli" },
    { id: "priority-qos", g: "Priority for critical services", q: "When does prioritizing results decrease QoS?", hint: "Also used in the counter-arguments on priority.", w: "Oriol", r: "Noa" },
    { id: "which-services", g: "Priority for critical services", q: "Which services need to be prioritized?", w: "Juli", r: "Nikolas" },
    { id: "encourage-infra", g: "More infrastructure", q: "How can improving the infrastructure be encouraged?", w: "Juli", r: "Noa" },
    { id: "who-pays", g: "More infrastructure", q: "Who pays for it?", hint: "If content providers pay, it feeds the question about stomaching the additional cost.", w: "Juli", r: "Oriol" },
    { id: "fair-competition", g: "Counter-argument: fair competition", q: "Is it true that fair competition is not guaranteed, for example because large content providers can access greater resources?", w: "Nikolas", r: "Noa" },
    { id: "isp-money", g: "Counter-argument: more budget does not mean more infrastructure", q: "What have ISPs done with the money previously?", w: "Oriol", r: "Nikolas" },
    { id: "roi", g: "Counter-argument: more budget does not mean more infrastructure", q: "How much is needed to improve the infrastructure, and what is the return on investment?", w: "Noa", r: "Juli" }
  ];
  var STATUS_IDS = COLS.map(function (c) { return c.id; });

  var state = {};
  var filter = null;
  var db = null;
  var canWrite = true;

  var boardEl = document.getElementById("board");
  var peopleEl = document.getElementById("people");
  var barEl = document.getElementById("bar");
  var progTextEl = document.getElementById("progress-text");
  var noteEl = document.getElementById("note");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function statusOf(id) { return state[id] || "todo"; }
  function matches(c) { return !filter || c.w === filter || c.r === filter; }
  function setNote(kind) {
    var msg = "";
    var warn = false;
    if (kind === "readonly") { msg = "View only mode."; warn = true; }
    else if (kind === "local") { msg = "Shared saving is not active. Moves stay on this screen only."; warn = true; }
    else if (kind === "error") { msg = "The last move could not be saved. Check your connection."; warn = true; }
    else if (kind === "shared") { msg = "Moves are saved live for everyone viewing this board."; }
    noteEl.textContent = msg;
    noteEl.className = warn ? "note warn" : "note";
  }

  function move(id, to) {
    if (!canWrite || statusOf(id) === to) return;
    state[id] = to;
    render();
    if (db) {
      db.collection("cards").doc(id).set({ status: to }, { merge: true })
        .then(function () { setNote("shared"); }, function () { setNote("error"); });
    }
  }

  function renderProgress() {
    barEl.textContent = "";
    var counts = {};
    STATUS_IDS.forEach(function (s) { counts[s] = 0; });
    CARDS.forEach(function (c) { counts[statusOf(c.id)]++; });
    COLS.forEach(function (col) {
      var seg = el("span");
      seg.style.background = col.color;
      seg.style.flexGrow = counts[col.id];
      seg.style.flexBasis = "0";
      seg.title = col.label + ": " + counts[col.id];
      barEl.appendChild(seg);
    });
    progTextEl.textContent = counts.proofread + " of " + CARDS.length + " proof read · " + counts.written + " written · " + counts.started + " started · " + counts.todo + " not started";
  }

  function renderPeople() {
    peopleEl.textContent = "";
    var all = el("button", "pchip");
    all.type = "button";
    all.setAttribute("aria-pressed", filter ? "false" : "true");
    all.appendChild(el("span", null, "Everyone"));
    all.appendChild(el("small", null, CARDS.length + " questions"));
    all.addEventListener("click", function () { filter = null; render(); });
    peopleEl.appendChild(all);
    PEOPLE.forEach(function (p) {
      var w = CARDS.filter(function (c) { return c.w === p; }).length;
      var r = CARDS.filter(function (c) { return c.r === p; }).length;
      var b = el("button", "pchip");
      b.type = "button";
      b.setAttribute("aria-pressed", filter === p ? "true" : "false");
      b.appendChild(el("span", null, p));
      b.appendChild(el("small", null, "writes " + w + " · proofreads " + r));
      b.addEventListener("click", function () { filter = filter === p ? null : p; render(); });
      peopleEl.appendChild(b);
    });
  }

  function roleEl(label, name) {
    var s = el("span", "role");
    s.appendChild(el("span", null, label));
    s.appendChild(el("span", "who " + name, name));
    return s;
  }

  function cardEl(c, ci) {
    var card = el("article", "card");
    card.appendChild(el("div", "group", c.g));
    card.appendChild(el("p", "q", c.q));
    if (c.hint) card.appendChild(el("p", "hint", c.hint));
    var roles = el("div", "roles");
    roles.appendChild(roleEl("Writes", c.w));
    roles.appendChild(roleEl("Proofreads", c.r));
    card.appendChild(roles);
    if (canWrite) {
      card.draggable = true;
      card.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", c.id);
        e.dataTransfer.effectAllowed = "move";
        card.classList.add("dragging");
      });
      card.addEventListener("dragend", function () { card.classList.remove("dragging"); });
      var actions = el("div", "actions");
      if (ci < COLS.length - 1) {
        var next = el("button", "btn", COLS[ci + 1].action);
        next.type = "button";
        next.addEventListener("click", function () { move(c.id, COLS[ci + 1].id); });
        actions.appendChild(next);
      }
      if (ci > 0) {
        var back = el("button", "btn ghost", "Back");
        back.type = "button";
        back.setAttribute("aria-label", "Move back to " + COLS[ci - 1].label);
        back.addEventListener("click", function () { move(c.id, COLS[ci - 1].id); });
        actions.appendChild(back);
      }
      card.appendChild(actions);
    }
    return card;
  }

  function render() {
    boardEl.textContent = "";
    COLS.forEach(function (col, ci) {
      var sec = el("section", "col");
      var items = CARDS.filter(function (c) { return statusOf(c.id) === col.id && matches(c); });
      var head = el("div", "col-head");
      var dot = el("span", "dot");
      dot.style.background = col.color;
      head.appendChild(dot);
      head.appendChild(el("h2", null, col.label));
      head.appendChild(el("span", "count", String(items.length)));
      sec.appendChild(head);
      var list = el("div", "list");
      if (canWrite) {
        list.addEventListener("dragover", function (e) { e.preventDefault(); list.classList.add("over"); });
        list.addEventListener("dragleave", function () { list.classList.remove("over"); });
        list.addEventListener("drop", function (e) {
          e.preventDefault();
          list.classList.remove("over");
          var id = e.dataTransfer.getData("text/plain");
          if (id) move(id, col.id);
        });
      }
      if (items.length === 0) {
        list.appendChild(el("div", "empty", filter ? "Nothing here for " + filter + "." : "Nothing here yet."));
      }
      items.forEach(function (c) { list.appendChild(cardEl(c, ci)); });
      sec.appendChild(list);
      boardEl.appendChild(sec);
    });
    renderProgress();
    renderPeople();
  }

  function init() {
    render();
    if (typeof firebase === "undefined" || !firebaseConfig.projectId || firebaseConfig.projectId === "YOUR_PROJECT_ID") {
      setNote("local");
      return;
    }
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      setNote("shared");

      db.collection("cards").onSnapshot(function (snap) {
        var next = {};
        snap.docs.forEach(function (d) {
          var data = d.data();
          var s = data && data.status;
          if (STATUS_IDS.indexOf(s) !== -1) next[d.id] = s;
        });
        state = next;
        render();
      }, function () {
        setNote("local");
      });
    } catch (e) {
      setNote("local");
    }
  }

  init();
})();
</script>
